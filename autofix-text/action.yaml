name: Autofix Text
description: Fix Markdown with markdownlint, format Shell with shfmt and docs with Oxfmt, then verify with lint-only check.

inputs:
  markdown-globs:
    description: Glob expression(s) of Markdown files to lint, newline-delimited.
    required: false
    default: "**/*.{md,markdown}"
  oxfmt-paths:
    description: Paths for Oxfmt to format, space-delimited (empty skips).
    required: false
    default: "**/*.md **/*.markdown **/*.yaml **/*.yml **/*.json **/*.jsonc **/*.json5 **/*.toml"
  enable-shfmt:
    description: Whether to run shfmt formatting.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Fix Markdown
      continue-on-error: true
      uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
      with:
        fix: true
        globs: ${{ inputs.markdown-globs }}
    - name: Format with Oxfmt
      env:
        OXFMT_VERSION: "0.72.0"
        OXFMT_PATHS: ${{ inputs.oxfmt-paths }}
      run: |
        set -o noglob
        [[ -n "${OXFMT_PATHS//[[:space:]]/}" ]] || exit 0
        # shellcheck disable=SC2086 # noglob is set above, so this only word-splits
        npx --yes "oxfmt@${OXFMT_VERSION}" --write --no-error-on-unmatched-pattern $OXFMT_PATHS
      shell: bash
    - name: Setup shfmt
      if: inputs.enable-shfmt == 'true'
      uses: mfinelli/setup-shfmt@a25fda4c1fe115aec0f85e04126610841bc3141d # v4.0.1
    - name: Format Shell with shfmt
      if: inputs.enable-shfmt == 'true'
      run: shfmt -w -i 2 -ci -sr .
      shell: bash
    - name: Commit changes
      uses: autofix-ci/action@c5b2d67aa2274e7b5a18224e8171550871fc7e4a # v1.3.4
    - name: Lint Markdown
      uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
      with:
        globs: ${{ inputs.markdown-globs }}
