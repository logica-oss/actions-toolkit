language: "en-US"

reviews:
  profile: assertive
  request_changes_workflow: true

  path_filters:
    - "!.github/skills/**"
    - "!.github/instructions/**"
    - "!.github/copilot-instructions.md"

  auto_review:
    enabled: true
    drafts: false
    ignore_usernames:
      - "renovate[bot]"
      - "mergify[bot]"

  path_instructions:
    - path: "release/action.yaml"
      instructions: "Accept by design (do not report): single main branch operation with date-based PR detection, fixed main branch, and listReleases lookup. Tag-only mode requires same-job Release creation; baseline advances only after a Release exists."
    - path: ".github/workflows/autofix.yaml"
      instructions: "Accept by design (do not report): the synac step intentionally omits the version input to always use the latest release; do not suggest pinning a version."
