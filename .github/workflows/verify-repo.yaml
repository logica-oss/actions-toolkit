name: Verify (Repo)

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: verify-repo-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-actions:
    name: Verify (Actions)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify actions
        uses: $/verify-actions

  verify-wait-for-workflow:
    name: Verify (Wait for Workflow)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Wait for CodeQL workflow
        uses: $/wait-for-workflow
        with:
          workflow-id: codeql.yaml
