name: autofix.ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: autofix-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  autofix:
    name: Autofix
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Sync Agent Config
        uses: logica-oss/synac@3f44c1c225ed3380e9989f8e07f98a2122138496 # v0.2.2
        with:
          verify: "false"
      - name: Autofix Text
        uses: $/autofix-text
