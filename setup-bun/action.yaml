name: Setup Bun environment
description: Set up JS runtimes, cache and install dependencies with Bun.

runs:
  using: composite
  steps:
    - name: Setup JS runtimes
      uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
    - name: Cache dependencies
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.bun/install/cache
          node_modules
        key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock', '**/mise.toml') }}
    - name: Install dependencies
      run: bun install --frozen-lockfile
      shell: bash
