name: Setup Bun environment
description: Set up JS runtimes, cache and install dependencies with Bun.

runs:
  using: composite
  steps:
    - name: Setup JS runtimes
      uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
    - name: Cache dependencies
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.bun/install/cache
          node_modules
        key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock', '**/mise.toml') }}
    - name: Install dependencies
      run: bun install --frozen-lockfile
      shell: bash
